<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;padding:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>UNIPERFORMANCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Michroma&display=swap">
<style>
/* Layout: CAD workspace — menu bar, dockable toolbar rows, large toolset rail, 3D viewport with scene tabs, tray of collapsible panels, status bar with measurements box. */
:root{
  --chrome:#eceef1; --chrome-2:#e1e5ea; --panel:#f6f7f9; --line:#ccd2d9; --ink:#1d2127; --ink-2:#5a636e;
  --accent:#d6323a; --accent-ink:#ffffff; --hover:#dce1e7; --tool-on:#cfe0f5; --tool-on-ink:#0f3b70; --tool-on-line:#7aa6dc;
  --vp-top:#dbe3ea; --vp-bot:#f3f4f1; --shadow:0 8px 28px rgba(20,24,30,.18); --field:#ffffff; --icon:#2a3340; --icon-acc:#d6323a; --icon-blue:#1f6fc5;
  --f-ui:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-display:'Michroma','Barlow',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#22252a; --chrome-2:#2a2e34; --panel:#1b1e22; --line:#3a4048; --ink:#e7e9ec; --ink-2:#9aa3ad;
  --accent:#ec474e; --hover:#343a42; --tool-on:#23405f; --tool-on-ink:#dbe9fb; --tool-on-line:#4a7bb5; --vp-top:#c9d2da; --vp-bot:#e6e8e4;
  --shadow:0 10px 30px rgba(0,0,0,.5); --field:#14171a; --icon:#d7dde4; --icon-acc:#f0575d; --icon-blue:#6aa8ee; color-scheme:dark}}
:root[data-theme="dark"]{
  --chrome:#22252a; --chrome-2:#2a2e34; --panel:#1b1e22; --line:#3a4048; --ink:#e7e9ec; --ink-2:#9aa3ad;
  --accent:#ec474e; --hover:#343a42; --tool-on:#23405f; --tool-on-ink:#dbe9fb; --tool-on-line:#4a7bb5; --vp-top:#c9d2da; --vp-bot:#e6e8e4;
  --shadow:0 10px 30px rgba(0,0,0,.5); --field:#14171a; --icon:#d7dde4; --icon-acc:#f0575d; --icon-blue:#6aa8ee; color-scheme:dark}
html,body{height:100%}
body{background:var(--chrome);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit}
#app{height:100%;width:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);overflow:hidden;overflow:clip}
.menubar{display:flex;align-items:center;gap:4px;padding:0 8px;height:56px;background:var(--chrome);border-bottom:1px solid var(--line);min-width:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding-right:12px;margin-right:2px;border-right:1px solid var(--line);height:100%;flex:none}
.brand img{height:46px;width:auto;border-radius:5px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.wordmark{font-family:var(--f-display);font-size:14px;letter-spacing:.08em;white-space:nowrap;font-weight:600}.wordmark b{color:var(--accent);font-weight:inherit}
.menus{display:flex;gap:1px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.mbtn{background:none;border:0;padding:5px 8px;border-radius:4px;cursor:pointer;font-weight:500;white-space:nowrap;font-size:13.5px}
.mbtn:hover,.mbtn[aria-expanded="true"]{background:var(--hover)}
.renderbtn{display:flex;align-items:center;gap:7px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:5px 12px;font-weight:600;cursor:pointer;flex:none}
.renderbtn svg{width:16px;height:16px}
.unitsel{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font:inherit;font-size:13px;flex:none}
.iconbtn{background:none;border:0;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
#tbars{display:flex;flex-wrap:wrap;gap:3px 4px;padding:3px 6px;background:var(--chrome);border-bottom:1px solid var(--line);min-width:0;max-height:40vh;overflow-y:auto}
#tbars:empty{display:none}
.tb{display:flex;align-items:center;gap:1px;padding:2px 3px 2px 2px;border:1px solid var(--line);border-radius:5px;background:var(--panel);flex:none}
.tb .grip{width:6px;align-self:stretch;margin-right:3px;background-image:radial-gradient(var(--ink-2) .8px,transparent .9px);background-size:3px 3px;opacity:.55;border-radius:2px}
.tb .sp{width:1px;height:20px;background:var(--line);margin:0 3px}
.tbtn{width:30px;height:30px;flex:none;border:1px solid transparent;border-radius:5px;background:none;display:grid;place-items:center;cursor:pointer;color:var(--icon);position:relative;padding:0}
.tbtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tbtn svg .a{stroke:var(--icon-acc)} .tbtn svg .af{fill:var(--icon-acc);stroke:none} .tbtn svg .b{stroke:var(--icon-blue)} .tbtn svg .bf{fill:var(--icon-blue);stroke:none} .tbtn svg .f{fill:currentColor;stroke:none} .tbtn svg .lf{fill:var(--icon-blue);fill-opacity:.22}
.tbtn:hover{background:var(--hover)}
.tbtn.on{background:var(--tool-on);color:var(--tool-on-ink);border-color:var(--tool-on-line)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn:focus-visible,.mbtn:focus-visible,.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.main{display:grid;grid-template-columns:auto minmax(0,1fr) 300px;min-height:0;min-width:0;overflow:hidden}
.main.nopanel{grid-template-columns:auto minmax(0,1fr) 0}
.main.nopanel .tray{display:none}
.large{background:var(--chrome);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;padding:4px;display:grid;grid-template-columns:repeat(2,30px);gap:2px;align-content:start;scrollbar-width:thin;min-height:0}
.large[hidden]{display:none!important}
.large .sp{grid-column:1/-1;height:1px;background:var(--line);margin:3px 0}
.viewport{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--vp-top) 0%,var(--vp-bot) 62%);min-width:0;min-height:0;touch-action:none}
.viewport.render{background:#9db7cf}
#c{display:block;width:100%;height:100%;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.92);color:#1d2127;border:1px solid #9aa3ad;border-radius:3px;padding:1px 6px;font-size:12px;font-family:var(--f-ui);white-space:nowrap;pointer-events:auto;cursor:default}
.lbl.dim{background:rgba(255,255,255,.85);border-color:transparent;font-family:var(--f-mono);font-size:11.5px}
.lbl.sel{outline:2px solid #2f6fe0}
.lbl.txt{transform:translate(0,-50%)}
#scenes{position:absolute;left:8px;top:6px;right:8px;display:flex;gap:3px;flex-wrap:wrap;pointer-events:none;z-index:4}
#scenes button{pointer-events:auto;background:rgba(255,255,255,.88);color:#1d2127;border:1px solid #b8c0c9;border-radius:4px 4px 0 0;padding:3px 10px;font-size:12.5px;cursor:pointer}
#scenes button.on{background:#ffffff;border-color:#6d7b8a;font-weight:600}
#dropzone{position:absolute;inset:8px;border:3px dashed #2f6fe0;border-radius:12px;background:rgba(47,111,224,.10);display:none;place-items:center;z-index:8;pointer-events:none;color:#123;font-weight:600;font-size:16px}
#dropzone.show{display:grid}
#ctxbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(25,60,110,.9);color:#fff;padding:5px 12px;border-radius:6px;font-size:12.5px;display:none;z-index:4;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#ctxbar button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:4px;padding:2px 8px;margin-left:8px;cursor:pointer}
.mk{position:absolute;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);display:none;z-index:5}
.mk.sq{border-radius:1px}
.mk.dia{border-radius:1px;transform:translate(-50%,-50%) rotate(45deg);width:9px;height:9px}
.tip{position:absolute;pointer-events:none;background:#fffef6;color:#222;border:1px solid #b8b29a;font-size:11.5px;padding:2px 6px;border-radius:3px;white-space:nowrap;display:none;z-index:5;font-family:var(--f-ui)}
#selbox{position:absolute;border:1px solid #2f6fe0;background:rgba(47,111,224,.08);pointer-events:none;display:none;z-index:3}
#selbox.cross{border-style:dashed;background:rgba(47,180,90,.08);border-color:#279445}
.vp-note{position:absolute;left:12px;bottom:10px;font-size:12px;color:#4b545e;background:rgba(255,255,255,.75);padding:3px 8px;border-radius:4px;pointer-events:none;max-width:calc(100% - 24px)}
.walkhint{position:absolute;left:50%;top:36px;transform:translateX(-50%);background:rgba(15,18,22,.66);color:#f2f2f2;padding:6px 12px;border-radius:6px;font-size:12.5px;pointer-events:none;white-space:nowrap;display:none;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;z-index:4}
.viewport.render .walkhint{display:block}
#recbadge{position:absolute;right:12px;top:10px;background:#c62828;color:#fff;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;display:none;z-index:6}
.tray{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.trayhead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);flex:none}
.traybody{overflow-y:auto;flex:1;min-height:0}
.tp{border-bottom:1px solid var(--line)}
.tp>button.th{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;text-align:left}
.tp>button.th::before{content:'▸';font-size:10px;color:var(--ink-2);width:10px;transition:transform .15s}
.tp.open>button.th::before{transform:rotate(90deg)}
.tp>button.th:hover{background:var(--hover)}
.tp .tbd{padding:4px 12px 14px;display:none}
.tp.open .tbd{display:block}
.ptitle{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);font-weight:600;margin:8px 0 6px}
.sec{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.matcat{font-size:11px;font-weight:600;color:var(--ink-2);margin:9px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.sw{aspect-ratio:1;border-radius:5px;border:1px solid rgba(0,0,0,.18);cursor:pointer;position:relative;padding:0;max-width:100%;background-size:cover}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.sw.def{background:linear-gradient(135deg,#f2f0ea 0 50%,#9aa7bd 50% 100%)}
.matnow{display:flex;align-items:center;gap:10px;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--field)}
.matnow .chip{width:30px;height:30px;border-radius:5px;border:1px solid rgba(0,0,0,.15);flex:none}
.matnow b{display:block;font-weight:600;font-size:13px}
.matnow small{color:var(--ink-2)}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.row label{color:var(--ink-2);font-size:13px}
.row input[type=range]{flex:1;min-width:80px;accent-color:var(--accent)}
.row output{font-family:var(--f-mono);font-size:12px;min-width:46px;text-align:right}
.inp{padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--field);color:var(--ink);font:inherit;font-size:13px;min-width:0}
select.inp{padding:4px 6px}
.btn{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:500;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;gap:3px}
.li{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--field);font-size:13px}
.li.on{border-color:var(--tool-on-line);background:var(--tool-on)}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.li .x{background:none;border:0;cursor:pointer;color:var(--ink-2);padding:0 4px;font-size:14px}
.li input[type=checkbox]{accent-color:var(--accent)}
.li .dot{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.2)}
.libgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.libitem{border:1px solid var(--line);border-radius:6px;background:var(--field);padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;text-align:center}
.libitem:hover{border-color:var(--tool-on-line)}
.libitem svg{width:32px;height:32px;fill:none;stroke:var(--icon);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.inst h3{font-size:15px;margin:0 0 6px;font-weight:600}
.inst p{margin:0 0 10px;color:var(--ink-2);line-height:1.45;font-size:13px}
.inst ol{margin:0 0 12px;padding-left:20px;line-height:1.45;font-size:13px}
.keys{display:flex;flex-direction:column;gap:5px;font-size:13px}
.keys div{display:flex;gap:8px;align-items:baseline}
kbd{font-family:var(--f-mono);font-size:11px;background:var(--field);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;white-space:nowrap}
.chat{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;margin-bottom:8px}
.msg{padding:7px 9px;border-radius:7px;font-size:13px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{background:var(--tool-on);align-self:flex-end;max-width:90%}
.msg.a{background:var(--field);border:1px solid var(--line)}
.msg.s{color:var(--ink-2);font-size:12px;font-style:italic}
textarea.inp{width:100%;resize:vertical;min-height:54px;box-sizing:border-box}
.note{color:var(--ink-2);font-size:12.5px;line-height:1.45;margin:0}
.status{display:flex;align-items:center;gap:12px;height:30px;padding:0 10px 0 12px;background:var(--chrome);border-top:1px solid var(--line);min-width:0}
#hint{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);font-size:13px}
.vcb{display:flex;align-items:center;gap:8px;flex:none}
.vcb[hidden]{display:none!important}
.vcb span{font-size:12px;color:var(--ink-2);white-space:nowrap}
#vcb{width:170px;font-family:var(--f-mono);font-size:13px;padding:3px 8px;border:1px solid var(--line);border-radius:4px;background:var(--field);color:var(--ink);font-variant-numeric:tabular-nums}
#vcb:focus{outline:2px solid var(--accent);outline-offset:0}
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow);padding:4px;min-width:230px;display:none;max-height:calc(100vh - 60px);overflow-y:auto}
.pop button{display:flex;width:100%;justify-content:space-between;gap:18px;align-items:center;background:none;border:0;padding:6px 10px;border-radius:5px;cursor:pointer;text-align:left;font-size:13.5px}
.pop button:hover{background:var(--hover)}
.pop button[disabled]{opacity:.45;cursor:default}
.pop button small{color:var(--ink-2);font-family:var(--f-mono);font-size:11px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.pop .ck::before{content:'';display:inline-block;width:16px;flex:none}
.pop .ck.on::before{content:'✓'}
.pop .ck span{flex:1}
.pop .sub::after{content:'▸';color:var(--ink-2);font-size:10px}
#toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%) translateY(10px);background:#272b31;color:#fff;padding:8px 14px;border-radius:7px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:80;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.45);display:none;place-items:center;z-index:70;padding:16px}
.modal.show{display:grid}
.mbox{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px;box-sizing:border-box}
.mbox h2{margin:0 0 10px;font-size:18px;font-weight:600;text-wrap:balance}
.mbox p{line-height:1.5;color:var(--ink-2);margin:0 0 12px}
.mbox .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.mbox img{border-radius:8px;width:100%;display:block;margin-bottom:12px}
.mbox .grid2{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.mbox .grid2 label{color:var(--ink-2);font-size:13px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13px}
.kgrid div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}
#splash{position:fixed;inset:0;background:#55585e;display:grid;place-items:center;z-index:100;transition:opacity .5s;padding:16px}
#splash .in{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:820px;width:100%}
#splash img{width:100%;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#splash .nm{font-family:var(--f-display);color:#f3f3f3;letter-spacing:.16em;font-size:clamp(16px,3.6vw,28px)}
#splash .bar{width:160px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
#splash .bar i{display:block;height:100%;width:40%;background:#e24a4f;animation:ld 1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
#splash.hide{opacity:0;pointer-events:none}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:var(--field);border:0;border-right:1px solid var(--line);padding:5px 2px;cursor:pointer;font-size:12.5px}
.seg button:last-child{border-right:0}
.seg button.on{background:#272b31;color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;cursor:pointer}
.tog input{accent-color:var(--accent);width:16px;height:16px}
body.rendering .hide-render{display:none!important}
body.rendering .tbtn.model{opacity:.3;pointer-events:none}
#printArea{display:none}
@media print{ body *{visibility:hidden!important} #printArea,#printArea *{visibility:visible!important} #printArea{display:block!important;position:fixed;inset:0;background:#fff} #printArea img{width:100%;height:auto} #printArea h1{font:600 14pt var(--f-ui);margin:0 0 8px} }
@media (max-width:1180px){.wordmark{display:none}}
@media (max-width:760px){
  .menubar{height:48px}.brand img{height:36px}
  .main{grid-template-columns:auto minmax(0,1fr) 0;position:relative}
  .main .tray{display:none}
  .main.showpanel .tray{display:flex;position:absolute;right:0;top:0;bottom:0;width:min(320px,88vw);z-index:20;box-shadow:var(--shadow)}
  #vcb{width:100px}
  .vcb span{display:none}
  .renderbtn span{display:none}
  .unitsel{display:none}
  #tbars{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-height:none;scrollbar-width:thin}
}
@media (prefers-reduced-motion:reduce){#splash .bar i{animation:none}#toast{transition:none}}
</style>


</head>
<body>

/* ================= Groups & components ================= */
function makeGroupFromSelection(asComp,name){
  const F=[...sel.F], Gs=[...sel.G]; const Eset=new Set(sel.E);
  if(!F.length&&!Eset.size&&!Gs.length){ toast('Selecione o que vai virar '+(asComp?'componente':'grupo')); return null; }
  for(const fid of F){ for(const L of loopsOf(M.F.get(fid))) for(let i=0;i<L.length;i++) Eset.add(ek(L[i],L[(i+1)%L.length])); }
  const gid=M.nid++;
  const insideV=new Set(); for(const fid of F) loopsOf(M.F.get(fid)).flat().forEach(v=>insideV.add(v)); for(const k of Eset){ const e=M.E.get(k); if(e){ insideV.add(e.a); insideV.add(e.b); } }
  const Fset=new Set(F); const usedOut=new Set();
  for(const [fid,f] of M.F) if(inCtx(f)&&!Fset.has(fid)) loopsOf(f).flat().forEach(v=>usedOut.add(v));
  for(const [k,e] of M.E) if(inCtx(e)&&!Eset.has(k)){ usedOut.add(e.a); usedOut.add(e.b); }
  const vmap=new Map(); for(const v of insideV){ if(usedOut.has(v)) vmap.set(v,newVert(P(v),gid)); else M.VG.set(v,gid); }
  const r=v=>vmap.get(v)??v;
  for(const fid of F){ const f=M.F.get(fid); f.o=f.o.map(r); f.hs=f.hs.map(h=>h.map(r)); f.g=gid; }
  for(const k of Eset){ const e=M.E.get(k); if(!e) continue; const usedByOutsideFace=[...M.F.entries()].some(([fid,f])=>inCtx(f)&&!Fset.has(fid)&&loopsOf(f).some(L=>loopHasEdge(L,e.a,e.b))); if(!usedByOutsideFace) M.E.delete(k); addEdgeRaw(r(e.a),r(e.b),gid,{h:e.h,s:e.s,tag:e.tag}); }
  for(const g of Gs){ M.Gr.get(g).parent=gid; }
  const b=groupBox(gid); const o=b.isEmpty()?new V3():b.min.clone();
  const nGroups=[...M.Gr.values()].filter(x=>!x.def).length+1;
  const G={id:gid,name:name||('Grupo '+nGroups),parent:ctx,mx:new M4().makeTranslation(o.x,o.y,o.z).toArray(),def:null,tag:null,h:false,lock:false,cls:null,m:null};
  M.Gr.set(gid,G);
  if(asComp){ const did='d'+M.nid++; M.defs.set(did,{id:did,name:name||'Componente'}); G.def=did; }
  sel.F.clear(); sel.E.clear(); sel.G.clear(); sel.G.add(gid); refreshSelSub();
  return gid;
}
function explodeGroup(gid){ const G=M.Gr.get(gid); if(!G) return; const par=G.parent||0;
  for(const f of M.F.values()) if((f.g||0)===gid) f.g=par; for(const e of M.E.values()) if((e.g||0)===gid) e.g=par;
  for(const [v,g] of [...M.VG]) if(g===gid){ if(par) M.VG.set(v,par); else M.VG.delete(v); }
  for(const c of M.Gr.values()) if((c.parent||0)===gid) c.parent=par;
  if(G.m) for(const f of M.F.values()) if((f.g||0)===par&&!f.m) {}
  M.Gr.delete(gid); mergeCoincident(par); }
function deleteGroup(gid){ const sub=subtree(gid); for(const [fid,f] of [...M.F]) if(sub.has(f.g||0)) M.F.delete(fid); for(const [k,e] of [...M.E]) if(sub.has(e.g||0)) M.E.delete(k); for(const g of sub) M.Gr.delete(g); }
function makeUnique(gid){ const G=M.Gr.get(gid); if(!G||!G.def) return; const d=M.defs.get(G.def); const did='d'+M.nid++; M.defs.set(did,{...d,id:did,name:(d?d.name:'Componente')+' #'+(M.defs.size+1)}); G.def=did; }
function isSolid(gid){ const sub=subtree(gid); const cnt=new Map(); let any=false; for(const f of M.F.values()){ if(!sub.has(f.g||0)) continue; any=true; for(const L of loopsOf(f)) for(let i=0;i<L.length;i++){ const k=ek(L[i],L[(i+1)%L.length]); cnt.set(k,(cnt.get(k)||0)+1); } } if(!any) return false; for(const c of cnt.values()) if(c!==2) return false; return true; }
function groupVolume(gid){ const sub=subtree(gid); let v=0; for(const f of M.F.values()){ if(!sub.has(f.g||0)) continue; let Tr; try{ Tr=triangulate(f); }catch(e){ continue; } for(const t of Tr.tris){ const [a,b,c]=t.map(P); v+=a.dot(new V3().crossVectors(b,c))/6; } } return Math.abs(v); }

/* ================= Builder (geometry generators) ================= */
function builder(gid,m4,dry,ptsArr){
  const pts=ptsArr||[]; const keyOf=p=>Math.round(p.x*1e5)+','+Math.round(p.y*1e5)+','+Math.round(p.z*1e5);
  const mkV=()=>{ const map=new Map(); return (x,y,z)=>{ const p=new V3(x,y,z).applyMatrix4(m4); if(dry){ pts.push(p); return pts.length-1; } const k=keyOf(p); if(map.has(k)) return map.get(k); const id=newVert(p,gid); map.set(k,id); return id; }; };
  const face=(ids,mat,holes)=>{ if(dry) return; const u=ids.filter((v,i)=>v!==ids[(i+1)%ids.length]); if(u.length<3||newell(u.map(P)).lengthSq()<1e-14) return; const id=createFaceRaw(u,mat,null,gid); if(holes&&holes.length){ M.F.get(id).hs=holes; for(const h of holes) for(let i=0;i<h.length;i++) addEdgeRaw(h[i],h[(i+1)%h.length],gid); } };
  const B={
    pts,
    box(x,y,z,w,d,h,mat){ const V=mkV(); const c=[V(x,y,z),V(x+w,y,z),V(x+w,y+d,z),V(x,y+d,z),V(x,y,z+h),V(x+w,y,z+h),V(x+w,y+d,z+h),V(x,y+d,z+h)]; face([c[0],c[3],c[2],c[1]],mat); face([c[4],c[5],c[6],c[7]],mat); face([c[0],c[1],c[5],c[4]],mat); face([c[3],c[7],c[6],c[2]],mat); face([c[0],c[4],c[7],c[3]],mat); face([c[1],c[2],c[6],c[5]],mat); },
    cyl(cx,cy,z,r,h,seg,mat,r2){ const V=mkV(); const top=r2??r; const bot=[],tp=[]; for(let i=0;i<seg;i++){ const a=i/seg*Math.PI*2; bot.push(V(cx+Math.cos(a)*r,cy+Math.sin(a)*r,z)); tp.push(V(cx+Math.cos(a)*top,cy+Math.sin(a)*top,z+h)); } face(bot.slice().reverse(),mat); if(top>1e-6) face(tp,mat); for(let i=0;i<seg;i++){ const j=(i+1)%seg; if(top>1e-6) face([bot[i],bot[j],tp[j],tp[i]],mat); else face([bot[i],bot[j],tp[0]],mat); } },
    geom(geo,mat,local){ const V=mkV(); const g=geo.index?geo.toNonIndexed():geo; const p=g.attributes.position; const lm=local||new M4(); for(let i=0;i<p.count;i+=3){ const a=new V3().fromBufferAttribute(p,i).applyMatrix4(lm), b=new V3().fromBufferAttribute(p,i+1).applyMatrix4(lm), c=new V3().fromBufferAttribute(p,i+2).applyMatrix4(lm); face([V(a.x,a.y,a.z),V(b.x,b.y,b.z),V(c.x,c.y,c.z)],mat); } },
    prism(poly,z,h,mat){ const V=mkV(); const b=poly.map(([x,y])=>V(x,y,z)), t=poly.map(([x,y])=>V(x,y,z+h)); face(b.slice().reverse(),mat); face(t,mat); for(let i=0;i<poly.length;i++){ const j=(i+1)%poly.length; face([b[i],b[j],t[j],t[i]],mat); } },
    extrudeXZ(outer,holes,y0,depth,mat){ const V=mkV(); const fr=l=>l.map(([x,z])=>V(x,y0,z)), bk=l=>l.map(([x,z])=>V(x,y0+depth,z)); const fo=fr(outer), bo=bk(outer), fh=holes.map(fr), bh=holes.map(bk);
      face(fo,mat,fh); face(bo.slice().reverse(),mat,bh.map(h=>h.slice().reverse()));
      for(const [F_,B_] of [[fo,bo],...fh.map((h,i)=>[h,bh[i]])]) for(let i=0;i<F_.length;i++){ const j=(i+1)%F_.length; face([B_[i],B_[j],F_[j],F_[i]],mat); } },
    sub(m){ return builder(gid,m4.clone().multiply(m),dry,pts); },
  };
  return B;
}
function localBox(spec){ const B=builder(0,new M4(),true); spec.build(B); const b=new THREE.Box3(); for(const p of B.pts) b.expandByPoint(p); return b; }

function cutOpening(fid,rectW){ // rectW: 4 world points on the face plane (bottom-left, bottom-right, top-right, top-left)
  const f=M.F.get(fid); if(!f||!inCtx(f)) return false; const n=faceNormal(f);
  const inside=rectW.map(p=>faceContains(f,p,true));
  if(inside.every(Boolean)){ const before=new Set(M.F.keys()); const id=makePolygonFace(rectW,n); if(id!=null&&!before.has(id)){ M.F.delete(id); return true; } return false; }

  const onB=p=>{ const o=P(f.o[0]), B=basisFor(n); const q=to2(p,o,B); return onBoundary2(q,f.o.map(v=>to2(P(v),o,B)),1e-3); };

  const c=rectW.reduce((a,p)=>a.add(p),new V3()).divideScalar(4);

function throughWall(front,n,isDoor){ // find the parallel face behind the wall and open it too, then close the reveals

async function solidOp(op,aId,bId,keepA){
  let C; try{ C=await loadCSG(); }catch(e){ toast('Não foi possível carregar as ferramentas de sólidos (sem internet?)'); return; }

  pushUndo();
  const ev=new C.Evaluator(); ev.attributes=['position','normal']; ev.useGroups=false;
  const A=new C.Brush(groupGeometry(aId)), B=new C.Brush(groupGeometry(bId)); A.updateMatrixWorld(); B.updateMatrixWorld();
  const res=(o)=>{ const r=ev.evaluate(o.a,o.b,o.op); const g=r.geometry.index?r.geometry.toNonIndexed():r.geometry; const p=g.attributes.position; const tris=[]; for(let i=0;i<p.count;i+=3) tris.push([new V3().fromBufferAttribute(p,i),new V3().fromBufferAttribute(p,i+1),new V3().fromBufferAttribute(p,i+2)]); return tris; };
  const nameB=groupName(M.Gr.get(bId)), matB=dominantMat(bId), matA=dominantMat(aId); const out=[];

  else if(op==='split'){ out.push(trisToGroup(res({a:A,b:B,op:C.INTERSECTION}),nameB+' (comum)',matB)); out.push(trisToGroup(res({a:A,b:B,op:C.SUBTRACTION}),groupName(M.Gr.get(aId))+' (parte)',matA)); out.push(trisToGroup(res({a:B,b:A,op:C.SUBTRACTION}),nameB+' (parte)',matB)); }

/* ================= Follow Me & Intersect ================= */
function pathFromSelection(profileFid){
  if(sel.F.size>=1&&!sel.E.size){ const fid=[...sel.F].find(f=>f!==profileFid); if(fid==null) return null; const f=M.F.get(fid); return {pts:f.o.map(v=>P(v).clone()),closed:true}; }
  const prof=M.F.get(profileFid); const es=[...sel.E].map(k=>M.E.get(k)).filter(e=>e&&!loopHasEdge(prof.o,e.a,e.b)); if(!es.length) return null;
  const adj=new Map(); for(const e of es){ for(const [x,y] of [[e.a,e.b],[e.b,e.a]]){ if(!adj.has(x)) adj.set(x,[]); adj.get(x).push(y); } }
  if([...adj.values()].some(l=>l.length>2)) return null;
  let start=[...adj.keys()].find(v=>adj.get(v).length===1); const closed=start==null; if(closed) start=es[0].a;
  const out=[start]; let prev=null, cur=start; for(let i=0;i<es.length+1;i++){ const nx=adj.get(cur).find(v=>v!==prev); if(nx==null||(closed&&nx===start)) break; out.push(nx); prev=cur; cur=nx; }
  if(out.length<2) return null; return {pts:out.map(v=>P(v).clone()),closed};
}
function followMe(fid,path){
  const f=M.F.get(fid); let prof=f.o.map(v=>P(v).clone()); const pts=path.pts.slice(); const n=pts.length;
  const pc=prof.reduce((a,p)=>a.add(p),new V3()).divideScalar(prof.length);
  if(path.closed){ let bi=0,bd=Infinity; pts.forEach((p,i)=>{ const d=p.distanceTo(pc); if(d<bd){ bd=d; bi=i; } }); const r=[...pts.slice(bi),...pts.slice(0,bi)]; pts.splice(0,n,...r); }
  else if(pc.distanceTo(pts[n-1])<pc.distanceTo(pts[0])) pts.reverse();
  const dirs=[]; for(let i=0;i<n-1;i++) dirs.push(pts[i+1].clone().sub(pts[i]).normalize()); if(path.closed) dirs.push(pts[0].clone().sub(pts[n-1]).normalize());
  if(newell(prof).dot(dirs[0])<0) prof.reverse();
  const proj=(ring,d,p,m)=>ring.map(x=>{ const den=d.dot(m); if(Math.abs(den)<1e-9) return x.clone(); const t=p.clone().sub(x).dot(m)/den; return x.clone().addScaledVector(d,t); });
  const m0=path.closed?dirs[n-1].clone().add(dirs[0]).normalize():dirs[0].clone();
  const rings=[proj(prof,dirs[0],pts[0],m0)];
  const last=path.closed?n-1:n-1;
  for(let i=1;i<=last;i++){ const m=(i<n-1||path.closed)?dirs[i-1].clone().add(dirs[i%dirs.length]).normalize():dirs[n-2].clone(); rings.push(proj(rings[i-1],dirs[i-1],pts[i],m)); }
  const vr=rings.map(r=>r.map(p=>newVert(p)));
  const segCount=path.closed?vr.length:vr.length-1;
  for(let i=0;i<segCount;i++){ const A=vr[i], Bq=vr[(i+1)%vr.length]; for(let k=0;k<A.length;k++){ const k2=(k+1)%A.length; createFaceRaw([A[k],A[k2],Bq[k2],Bq[k]],f.m,f.bm); } }
  if(!path.closed){ createFaceRaw(vr[0].slice().reverse(),f.m,f.bm); createFaceRaw(vr[vr.length-1].slice(),f.m,f.bm); }
  const L=f.o; M.F.delete(fid); const fes=faceEdgeSet(); for(let i=0;i<L.length;i++){ const k=ek(L[i],L[(i+1)%L.length]); if(!fes.has(k)) M.E.delete(k); }
  mergeCoincident(ctx);
}
function lineIntervals(f,p,dir){ const n=faceNormal(f); const ts=[]; for(const L of loopsOf(f)) for(let i=0;i<L.length;i++){ const a=P(L[i]), b=P(L[(i+1)%L.length]); const sa=new V3().crossVectors(a.clone().sub(p),dir).dot(n), sb=new V3().crossVectors(b.clone().sub(p),dir).dot(n); if((sa>0)!==(sb>0)){ const x=a.clone().lerp(b,sa/(sa-sb)); ts.push(x.clone().sub(p).dot(dir)/dir.lengthSq()); } } ts.sort((a,b)=>a-b); const out=[]; for(let i=0;i+1<ts.length;i+=2) out.push([ts[i],ts[i+1]]); return out; }
function intersectFaces(){
  const t=gatherSelTarget(); const A=[], Bf=[]; const all=[...M.F.entries()].filter(([,f])=>entVisible(f));
  if(t){ const gs=t.groups; for(const [id,f] of all){ if(t.F.includes(id)||gs.has(f.g||0)) A.push(id); else Bf.push(id); } } else { for(const [id] of all){ A.push(id); Bf.push(id); } }
  if(!A.length){ toast('Nada para interseccionar'); return; }
  pushUndo(); const segs=[];
  for(const ia of A) for(const ib of Bf){ if(ia===ib||(!t&&ib<ia)) continue; const fa=M.F.get(ia), fb=M.F.get(ib); const na=faceNormal(fa), nb=faceNormal(fb); const u=new V3().crossVectors(na,nb); if(u.lengthSq()<1e-8) continue;
    const da=na.dot(P(fa.o[0])), db=nb.dot(P(fb.o[0])); const p=new V3().crossVectors(nb,u).multiplyScalar(da).add(new V3().crossVectors(u,na).multiplyScalar(db)).divideScalar(u.lengthSq());

  for(const [a,b] of segs){ if(a.distanceTo(b)<1e-5) continue; const ia=ensureVertex(a), ib=ensureVertex(b); addSegment(ia,ib,true); }
  afterChange(); toast(segs.length?segs.length+' linhas de interseção criadas':'Nenhuma interseção encontrada');

/* ================= Sandbox (terrain) ================= */
function delaunay(pts){ // pts: [{x,y}] → triangles [i,j,k]
  const n=pts.length; if(n<3) return []; let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity; for(const p of pts){ minx=Math.min(minx,p.x); miny=Math.min(miny,p.y); maxx=Math.max(maxx,p.x); maxy=Math.max(maxy,p.y); }

  let tris=[[n,n+1,n+2]]; const cc=t=>{ const [a,b,c]=t.map(i=>P2[i]); const D=2*(a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y)); if(Math.abs(D)<1e-14) return {x:0,y:0,r:Infinity}; const ux=((a.x*a.x+a.y*a.y)*(b.y-c.y)+(b.x*b.x+b.y*b.y)*(c.y-a.y)+(c.x*c.x+c.y*c.y)*(a.y-b.y))/D, uy=((a.x*a.x+a.y*a.y)*(c.x-b.x)+(b.x*b.x+b.y*b.y)*(a.x-c.x)+(c.x*c.x+c.y*c.y)*(b.x-a.x))/D; return {x:ux,y:uy,r:(a.x-ux)**2+(a.y-uy)**2}; };
  let C=tris.map(cc);
  for(let i=0;i<n;i++){ const p=P2[i]; const bad=[], keep=[], keepC=[]; tris.forEach((t,k)=>{ const c=C[k]; if((p.x-c.x)**2+(p.y-c.y)**2<c.r) bad.push(t); else { keep.push(t); keepC.push(c); } });
    const ec=new Map(); for(const t of bad) for(let k=0;k<3;k++){ const a=t[k], b=t[(k+1)%3]; const key=a<b?a+'_'+b:b+'_'+a; ec.set(key,(ec.get(key)||{a,b,c:0})); ec.get(key).c++; }
    tris=keep; C=keepC; for(const e of ec.values()) if(e.c===1){ const t=[e.a,e.b,i]; tris.push(t); C.push(cc(t)); } }
  return tris.filter(t=>t.every(i=>i<n)).map(([a,b,c])=>{ const A=P2[a],B=P2[b],Cc=P2[c]; return ((B.x-A.x)*(Cc.y-A.y)-(Cc.x-A.x)*(B.y-A.y))>0?[a,b,c]:[a,c,b]; });

function terrainFromPoints(pts3,name='Terreno'){
  const uniq=[]; const seen=new Set(); for(const p of pts3){ const k=Math.round(p.x*1e3)+','+Math.round(p.y*1e3); if(seen.has(k)) continue; seen.add(k); uniq.push(p); }

  const tagMap=new Map(); const tagOf=name=>{ if(!name||/^(Layer0|Untagged|Sem etiqueta)$/i.test(name)) return null; if(tagMap.has(name)) return tagMap.get(name); const L=model.layers.find(l=>l.name===name); let t=M.tags.find(x=>x.name===name); if(!t){ const col=L&&L.color?'#'+[L.color.r,L.color.g,L.color.b].map(v=>(v|0).toString(16).padStart(2,'0')).join(''):'#9aa3ad'; t={id:'t'+M.nid++,name,vis:!(L&&L.hidden),color:col}; M.tags.push(t); stats.tags++; } tagMap.set(name,t.id); return t.id; };

      const F_=M.F.get(fid); F_.hs=lv.slice(1).filter(Boolean); for(const h of F_.hs) for(let i=0;i<h.length;i++) addEdgeRaw(h[i],h[(i+1)%h.length],gid); if(f.hidden) F_.h=true; stats.faces++; }
    if(opts.guides&&gid===parentG){ for(const c of d.constructionLines||[]){ if(!c.point||!c.direction) continue; const p=new V3(...c.point).multiplyScalar(SKP_IN).applyMatrix4(W), dd=new V3(...c.direction).transformDirection(W); M.G.push({p,d:dd}); } for(const c of d.constructionPoints||[]) if(c.position) M.G.push({p:new V3(...c.position).multiplyScalar(SKP_IN).applyMatrix4(W)}); }
    for(const inst of d.instances){ const cd=model.definitions.get(inst.refIdx); if(!cd) continue; const IW=W.clone().multiply(skpMatrix(inst.matrix));
      let def=null; if((placed.get(inst.refIdx)||0)>1&&!cd.isImage){ if(!defIds.has(inst.refIdx)){ const did='d'+M.nid++; M.defs.set(did,{id:did,name:skpNameOk(cd.name)?cd.name:(inst.name||'Componente')}); defIds.set(inst.refIdx,did); stats.comps++; } def=defIds.get(inst.refIdx); }
      const ng=M.nid++; stats.groups++;
      M.Gr.set(ng,{id:ng,name:inst.name||(skpNameOk(cd.name)?cd.name:(def?'Componente':'Grupo')),parent:gid,mx:IW.toArray(),def,tag:tagOf(inst.layer),h:!!inst.hidden,lock:false,cls:null,m:inst.materialId!=null?matMap.get(inst.materialId)||null:null});

  return stats; }

async function openSKPUI(f,mode='open'){
  toast('Lendo '+f.name+'…'); await new Promise(r=>setTimeout(r,40));
  let parsed; try{ parsed=await skpParse(f); }catch(err){ console.error(err); skpFailModal(f,err); return; }
  const {model,thumb}=parsed; const vl=skpVersionLabel(model.version);
  pushUndo();
  try{
    let gid=0;
    if(mode==='open'){ ctx=0; const keepLoc=M.loc; freshModel(); M.loc=keepLoc; buildAxes(); sel.F.clear(); sel.E.clear(); sel.G.clear(); if(sel.A) sel.A.clear(); M.info.desc=f.name.replace(/\.skp$/i,''); $('#vpnote').hidden=true;
      const u=String(model.units||''); const um=/milli/i.test(u)?'mm':/centi/i.test(u)?'cm':/met/i.test(u)?'m':null; if(um){ unit=um; const s=$('#unitSel'); if(s) s.value=um; } }
    else { gid=M.nid++; M.Gr.set(gid,{id:gid,name:f.name.replace(/\.skp$/i,''),parent:ctx,mx:new M4().toArray(),def:null,tag:null,h:false,lock:false,cls:null,m:null}); }
    const st=await skpBuild(model,{parent:gid,scenes:mode==='open',guides:true});
    sel.F.clear(); sel.E.clear(); sel.G=gid?new Set([gid]):new Set(); if(typeof refreshSelSub==='function') refreshSelSub();
    afterChange(); buildSceneTabs(); zoomExtents();
    const nothing=!st.faces&&!st.edges;
    toast(nothing?`${vl}: o arquivo não tem geometria visível`:`${mode==='open'?'Aberto':'Importado'} (${vl}): ${st.faces.toLocaleString('pt-BR')} faces, ${st.groups} grupos/componentes, ${st.mats} materiais`);
    if(st.faces>60000) setTimeout(()=>toast('Modelo grande: para navegar mais leve, use o estilo Sombreado ou oculte etiquetas.'),3500);
    if(thumb) setTimeout(()=>URL.revokeObjectURL(thumb),4000);
  }catch(err){ console.error(err); undo(); skpFailModal(f,err); } }

/* ---------- write .skp (OpenSKP writer, SketchUp 2017 file format — opens in SketchUp 2017 through 2026) ---------- */
function buildSKPBytes(){
  if(!window.OpenSkp||!OpenSkp.create) throw new Error('gravador de .skp indisponível');
  const B=OpenSkp.create(), IN=1/SKP_IN, st={faces:0,skipped:0,groups:0,comps:0,mats:0,edges:0};
  const nameUniq=(()=>{ const seen=new Set(); return (n,fb)=>{ let b=String(n||fb).replace(/[\u0000-\u001f]/g,' ').trim().slice(0,120)||fb, s=b, i=2; while(seen.has(s.toLowerCase())) s=b+' #'+(i++); seen.add(s.toLowerCase()); return s; }; })();
  // materials actually used
  const used=new Set(); for(const f of M.F.values()){ if(f.m) used.add(f.m); if(f.bm) used.add(f.bm); } for(const G of M.Gr.values()) if(G.m) used.add(G.m);
  const matH=new Map(), matName=nameUniq;
  for(const id of used){ const m=matById(id); if(!m) continue; const op=Math.max(0,Math.min(1,m.op??1)); const nm=matName(m.name,'Material');
    try{ if(m.img||m.tex){ const url=m.img||makeTex(m.tex,m.color,m.p).cv.toDataURL('image/jpeg',.9); const {su,sv}=uvScale(m); matH.set(id,B.addTextureMaterial(nm,dataURLBytes(url),nm+(url.startsWith('data:image/png')?'.png':'.jpg'),sv*IN,su*IN,op)); }
      else { const [r,g,b]=hexRGB(m.color||'#cccccc'); matH.set(id,B.addMaterial(nm,[r,g,b,255],op)); }
      st.mats++; }catch(e){ console.warn('material',m.name,e); } }
  // tags → layers
  const layH=new Map(); const layName=(()=>{ const s=new Set(); return n=>{ let b=String(n).slice(0,120)||'Etiqueta', x=b, i=2; while(s.has(x)) x=b+' '+(i++); s.add(x); return x; }; })();
  for(const t of M.tags){ if(t.id==='t0') continue; const inUse=[...M.Gr.values()].some(g=>g.tag===t.id)||[...M.F.values()].some(f=>f.tag===t.id); if(!inUse) continue; try{ layH.set(t.id,B.addLayer(layName(t.name),{color:hexRGB(t.color||'#9aa3ad'),hidden:!t.vis})); }catch(e){} }
  const kids=new Map(); for(const G of M.Gr.values()){ const p=G.parent||0; if(!kids.has(p)) kids.set(p,[]); kids.get(p).push(G); }
  const facesOf=new Map(), edgesOf=new Map(); for(const [id,f] of M.F){ const g=f.g||0; if(!facesOf.has(g)) facesOf.set(g,[]); facesOf.get(g).push(f); } for(const e of M.E.values()){ const g=e.g||0; if(!edgesOf.has(g)) edgesOf.set(g,[]); edgesOf.get(g).push(e); }
  const mxOf=G=>new M4().fromArray(G.mx||new M4().toArray());
  const place=(parentMx,G)=>{ const rel=new M4().copy(parentMx).invert().multiply(mxOf(G)); const e=rel.elements; const o={name:String(G.name||'').slice(0,120)||undefined,translation:[e[12]*IN,e[13]*IN,e[14]*IN],matrix3x3:[e[0],e[4],e[8],e[1],e[5],e[9],e[2],e[6],e[10]],hidden:!!G.h}; if(G.m&&matH.has(G.m)) o.material=matH.get(G.m); if(G.tag&&layH.has(G.tag)) o.layer=layH.get(G.tag); return o; };
  // geometry of one context (group id) written into a definition builder D, local to matrix L
  const content=(D,gid,L)=>{ const inv=new M4().copy(L).invert(); const pc=new Map(); const pt=v=>{ let p=pc.get(v); if(!p){ const q=P(v).clone().applyMatrix4(inv); p=[q.x*IN,q.y*IN,q.z*IN]; pc.set(v,p); } return p; };
    const F=(facesOf.get(gid)||[]).filter(f=>f.o&&f.o.length>=3); const eInfo=k=>M.E.get(k);
    const loopEdges=f=>{ const r=[]; for(const L_ of [f.o,...(f.hs||[])]) for(let i=0;i<L_.length;i++) r.push(ek(L_[i],L_[(i+1)%L_.length])); return r; };
    const softFrac=f=>{ const ks=loopEdges(f); let s=0; for(const k of ks){ const e=eInfo(k); if(e&&e.s) s++; } return ks.length?s/ks.length:0; };
    F.sort((a,b)=>softFrac(a)-softFrac(b)); const made=new Set(), onFace=new Set();
    for(const f of F){ const ks=loopEdges(f); let ns=0,nh=0,nn=0; for(const k of ks){ onFace.add(k); if(made.has(k)) continue; const e=eInfo(k); nn++; if(e&&e.s) ns++; if(e&&e.h) nh++; }
      const soft=nn>0&&ns*2>nn, hid=nn>0&&nh*2>nn; const o={softEdges:soft,smoothEdges:soft,hiddenEdges:hid}; if(f.h) o.hidden=true; if(f.m&&matH.has(f.m)) o.material=matH.get(f.m); if(f.bm&&matH.has(f.bm)) o.backMaterial=matH.get(f.bm); if(f.tag&&layH.has(f.tag)) o.layer=layH.get(f.tag);
      if(f.hs&&f.hs.length) o.holes=f.hs.filter(h=>h.length>=3).map(h=>h.map(pt));
      try{ D.addFace(f.o.map(pt),o); for(const k of ks) made.add(k); st.faces++; }catch(err){ try{ o.autoTriangulate=true; D.addFace(f.o.map(pt),o); for(const k of ks) made.add(k); st.faces++; }catch(e2){ st.skipped++; } } }
    for(const e of edgesOf.get(gid)||[]){ const k=ek(e.a,e.b); if(onFace.has(k)||!M.V.has(e.a)||!M.V.has(e.b)) continue; try{ D.addPolyline([pt(e.a),pt(e.b)],{softEdges:!!e.s,smoothEdges:!!e.s,hiddenEdges:!!e.h}); st.edges++; }catch(err){} } };
  // definitions bottom-up (children before parents); components written once
  const defB=new Map(), grpB=new Map();
  const defineChildren=(gid)=>{ for(const G of kids.get(gid)||[]){ if(G.def&&defB.has(G.def)) continue; defineChildren(G.id);
      const make=D=>{ content(D,G.id,mxOf(G)); for(const C of kids.get(G.id)||[]){ const cb=C.def?defB.get(C.def):grpB.get(C.id); if(!cb) continue; const o=place(mxOf(G),C); if(C.def) D.addInstance(cb,o); else D.addGroupInstance(cb,o); } };
      if(gid===0&&!G.def) continue; // root-level groups are written later with addGroup
      if(G.def){ const nm=nameUniq((M.defs.get(G.def)||{}).name||G.name,'Componente'); defB.set(G.def,B.addComponentDefinition(nm,make)); st.comps++; } else { grpB.set(G.id,B.addComponentDefinition(nameUniq('Group#'+G.id,'Group'),make)); st.groups++; } } };
  defineChildren(0);
  // root-level groups (need their nested definitions already closed)
  for(const G of kids.get(0)||[]){ if(G.def) continue; for(const C of kids.get(G.id)||[]) if(!(C.def?defB.has(C.def):grpB.has(C.id))) defineChildren(G.id); }
  const I=new M4();
  for(const G of kids.get(0)||[]){ if(G.def) continue; const o=place(I,G); B.addGroup(D=>{ content(D,G.id,mxOf(G)); for(const C of kids.get(G.id)||[]){ const cb=C.def?defB.get(C.def):grpB.get(C.id); if(!cb) continue; const oo=place(mxOf(G),C); if(C.def) D.addInstance(cb,oo); else D.addGroupInstance(cb,oo); } },o); st.groups++; }
  for(const G of kids.get(0)||[]){ if(!G.def) continue; B.addInstance(defB.get(G.def),place(I,G)); }
  content(B,0,I);
  for(const g of M.G||[]){ try{ if(g.d) B.addConstructionLine([g.p.x*IN,g.p.y*IN,g.p.z*IN],{direction:[g.d.x,g.d.y,g.d.z]}); else B.addConstructionPoint([g.p.x*IN,g.p.y*IN,g.p.z*IN]); }catch(e){} }
  return {bytes:B.toBytes(),st}; }

async function exportSKP(){ if(!M.F.size&&!M.E.size){ toast('O modelo está vazio'); return; }
  toast('Gerando arquivo .skp…'); await new Promise(r=>setTimeout(r,30));
  let res; try{ res=buildSKPBytes(); }catch(err){ console.error(err); toast('Não consegui gerar o .skp: '+(err.message||err)); return; }
  const base=(M.info.desc||'modelo').replace(/[\\/:*?"<>|]+/g,'-').slice(0,60)||'modelo';
  if(DL) await saveFile(base+'-skp.zip',makeZip([{name:base+'.skp',data:res.bytes},{name:'LEIA-ME.txt',data:'Descompacte e abra '+base+'.skp no SketchUp (2017 ou mais novo).\r\nGerado pelo UNIPERFORMANCE.\r\n'}]));
  else await saveFile(base+'.skp',new Blob([res.bytes],{type:'application/octet-stream'}));
  if(res.st.skipped) setTimeout(()=>toast(res.st.skipped+' faces não puderam ser gravadas'),2500); }

const R={on:false,keys:new Set(),exposure:.55,sky:'clear',ao:true,bloomOn:true,env:true,edges:false,quality:'high',fov:55};

function pbrMat(m){
  if(!m) return new THREE.MeshStandardMaterial({color:new THREE.Color('#ecebe6'),roughness:.9,metalness:0,side:THREE.DoubleSide,map:makeTex('plaster','#ecebe6').t,bumpMap:makeTex('plaster','#ecebe6').t,bumpScale:.25,envMapIntensity:.75});

  if(m.kind==='water') return new THREE.MeshPhysicalMaterial({color:new THREE.Color(m.color),roughness:.06,metalness:0,transmission:.55,thickness:.5,ior:1.33,side:THREE.DoubleSide,clearcoat:1,clearcoatRoughness:.05});
  const p={color:new THREE.Color(m.tex||m.img?'#ffffff':m.color),roughness:m.rough??.7,metalness:m.metal||0,side:THREE.DoubleSide,envMapIntensity:.75};
  if(m.tex||m.img){ const tx=texOf(m); p.map=tx.t; if(!tx.img){ p.bumpMap=tx.t; p.bumpScale=tx.bump; } if(m.cut) p.alphaTest=.5; }

function lowpolyTree(r,x,y,s){ const g=new THREE.Group(); const tr_=new THREE.Mesh(new THREE.CylinderGeometry(.09*s,.14*s,1.6*s,7),new THREE.MeshStandardMaterial({color:'#5d4430',roughness:.9})); tr_.rotation.x=Math.PI/2; tr_.position.z=.8*s; tr_.castShadow=true; g.add(tr_);

function buildRenderScene(){
  const C=R.content; while(C.children.length){ const o=C.children.pop(); o.traverse(x=>{ x.geometry&&x.geometry.dispose(); }); }
  const groups=new Map();
  for(const f of M.F.values()){ if(!entVisible(f)) continue; let Tr; try{ Tr=triangulate(f); }catch(e){ continue; } const m=effMat(f,false)||effMat(f,true); const {su,sv}=m?uvScale(m):{su:2,sv:2}; const k=m?m.id:'__def';
    if(!groups.has(k)) groups.set(k,{p:[],n:[],uv:[],m}); const G=groups.get(k);
    for(const t of Tr.tris) for(const v of t){ const p=P(v); G.p.push(p.x,p.y,p.z); G.n.push(Tr.n.x,Tr.n.y,Tr.n.z); G.uv.push(p.dot(Tr.B.u)/su,p.dot(Tr.B.v)/sv); } }

    for(const f of d.F) if(sub.has(f.g||0)){ const ng=gmap.get(f.g); const id=createFaceRaw(f.o.map(v=>mv(v,ng)),f.m,f.bm,ng,f.t); M.F.get(id).hs=(f.hs||[]).map(h=>h.map(v=>mv(v,ng))); }

  openModal(`<h2>Informações do modelo</h2><div class="grid2"><label for="miA">Autor</label><input class="inp" id="miA" value="${esc(M.info.author)}"><label for="miD">Descrição</label><input class="inp" id="miD" value="${esc(M.info.desc)}"><label>Unidade</label><span>${({m:'Metros',cm:'Centímetros',mm:'Milímetros'})[unit]}</span><label>Localização</label><span>${esc(M.loc.city)} (${nf(M.loc.lat,3)}; ${nf(M.loc.lon,3)})</span></div>
  <dl class="kv" style="margin-top:12px"><dt>Faces</dt><dd>${M.F.size}</dd><dt>Arestas</dt><dd>${M.E.size}</dd><dt>Grupos</dt><dd>${[...M.Gr.values()].filter(g=>!g.def).length}</dd><dt>Componentes (cópias)</dt><dd>${[...M.Gr.values()].filter(g=>g.def).length}</dd><dt>Definições</dt><dd>${M.defs.size}</dd><dt>Materiais usados</dt><dd>${used.size}</dd><dt>Cotas e textos</dt><dd>${M.ann.length}</dd><dt>Cenas</dt><dd>${M.scenes.length}</dd><dt>Área total de faces</dt><dd>${fmtArea(area)}</dd></dl>
  <div class="acts"><button class="btn" id="miP">Limpar itens não usados</button><button class="btn primary" id="mOk">Fechar</button></div>`);
  $('#mOk').onclick=()=>{ M.info.author=$('#miA').value; M.info.desc=$('#miD').value; closeModal(); afterChange(); };
  $('#miP').onclick=()=>{ pushUndo(); const before=M.mats.length; M.mats=M.mats.filter(m=>used.has(m.id)||defaultMats().some(d=>d.id===m.id)); for(const [k,d] of [...M.defs]) if(![...M.Gr.values()].some(g=>g.def===k)) M.defs.delete(k); afterChange(); toast('Removidos '+(before-M.mats.length)+' materiais sem uso'); }; }
function attrsDialog(){ const g=sel.G.size===1?M.Gr.get([...sel.G][0]):null; if(!g){ toast('Selecione um grupo ou componente'); return; } const d=g.def?M.defs.get(g.def):null; const b=groupBox(g.id), s=b.getSize(new V3());
  const rows=[['Nome',groupName(g)],['Tipo',g.def?'Componente':'Grupo'],['Biblioteca',g.lib?LIB[g.lib].name:'—'],['Classe',g.cls||'—'],['Largura (X)',fmtLen(s.x)],['Profundidade (Y)',fmtLen(s.y)],['Altura (Z)',fmtLen(s.z)],['Posição',fmtV(b.min)],...Object.entries(g.par||{}).map(([k,v])=>[k,String(v)])];

function text3DDialog(){ openModal(`<h2>Texto 3D</h2><div class="grid2"><label for="t3T">Texto</label><input class="inp" id="t3T" value="UNI"><label for="t3H">Altura</label><input class="inp" id="t3H" value="1"><label for="t3D">Espessura</label><input class="inp" id="t3D" value="0,2"><label for="t3M">Material</label><select class="inp" id="t3M"><option value="">Padrão</option>${M.mats.map(m=>`<option value="${m.id}" ${m.id==='uni'?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="acts"><button class="btn" id="mNo">Cancelar</button><button class="btn primary" id="mOk">Posicionar</button></div>`);
  $('#mNo').onclick=closeModal; $('#mOk').onclick=()=>{ const t=$('#t3T').value.trim(); const h=parseLen($('#t3H').value)||1, dd=parseLen($('#t3D').value)??.2; const m=$('#t3M').value||null; closeModal(); if(!t) return; try{ T.place.begin(text3DSpec(t,h,Math.max(0,dd)||.001,m)); }catch(e){ console.error(e); toast('Não consegui gerar esse texto'); } }; }

function shareInfo(){ openModal(`<h2>Compartilhar com a equipe</h2><p>Na versão publicada no Claude, use o menu Compartilhar da página para dar acesso à equipe. Cada pessoa vê o mesmo aplicativo; os projetos salvos na Nuvem UNI ficam na conta de quem salvou.</p><p>Para enviar um projeto a alguém, use Arquivo ▸ Salvar e mande o arquivo .json; a pessoa abre com Arquivo ▸ Abrir.</p><div class="acts"><button class="btn primary" id="mOk">Entendi</button></div>`); $('#mOk').onclick=closeModal; }

/* ================= Files ================= */
let DL=null, SAMPLE=null, DB=null, USER=null, UID=null;
(async()=>{ try{ if(window.claude&&window.claude.use){ const [d,s,db,u]=await Promise.all(['downloads','sample','db','user'].map(n=>window.claude.use(n).catch(()=>null))); DL=d; SAMPLE=s; DB=db; USER=u; if(USER){ try{ UID=await USER.id(); }catch(e){} } if(openPanels.has('proj')) fillPanel('proj'); } }catch(e){} })();
async function saveFile(name,data,mime){
  if(DL){ try{ await DL.save({filename:name,data}); toast('Arquivo salvo: '+name); }catch(err){ const c=err&&err.code; toast(c==='declined'?'Download cancelado':c==='rate_limited'?'Aguarde e tente de novo':c==='rejected_extension'?'Formato não permitido aqui':'Não foi possível salvar o arquivo aqui'); } return; }
  try{ const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('Arquivo salvo: '+name); }catch(e){ toast('Não foi possível salvar o arquivo aqui'); }
}
function saveProject(){ saveFile('projeto-uni3d.json',serialize(),'application/json'); }
$('#fileIn').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; if(/\.skp$/i.test(f.name)){ openSKPUI(f,'open'); return; } if(/\.(dae|kmz)$/i.test(f.name)){ importDAEUI(f); return; } try{ const txt=await f.text(); const d=JSON.parse(txt); if(!d.V||!d.F) throw 0; pushUndo(); ctx=0; loadModel(d); buildAxes(); sel.F.clear(); sel.E.clear(); sel.G.clear(); afterChange(); buildSceneTabs(); zoomExtents(); toast('Projeto aberto: '+f.name); }catch(err){ toast('Arquivo inválido. Abra um projeto .json do UNIPERFORMANCE.'); } };
$('#objIn').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; try{ const txt=await f.text(); pushUndo(); importOBJ(txt,f.name); afterChange(); zoomExtents(); toast('OBJ importado como grupo'); }catch(err){ toast('Não consegui ler esse OBJ'); } };
$('#pcIn').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; toast('Lendo nuvem de pontos…'); try{ const txt=await f.text(); const data=parsePointCloud(txt,f.name); if(data.pos.length<9) throw new Error('vazio');
  let mn=Infinity,mxv=-Infinity; for(let i=0;i<data.pos.length;i+=3*Math.max(1,Math.floor(data.pos.length/30000))){ mn=Math.min(mn,data.pos[i],data.pos[i+1]); mxv=Math.max(mxv,data.pos[i],data.pos[i+1]); } const span=mxv-mn; const guess=span>2000?'mm':span>200?'cm':'m';
  openModal(`<h2>Importar nuvem de pontos</h2><p>${(data.pos.length/3).toLocaleString('pt-BR')} pontos em ${esc(f.name)}. Em que unidade estão as coordenadas?</p><select class="inp" id="pcU"><option value="m" ${guess==='m'?'selected':''}>Metros</option><option value="cm" ${guess==='cm'?'selected':''}>Centímetros</option><option value="mm" ${guess==='mm'?'selected':''}>Milímetros</option></select><div class="acts"><button class="btn" id="mNo">Cancelar</button><button class="btn primary" id="mOk">Importar</button></div>`);
  $('#mNo').onclick=closeModal; $('#mOk').onclick=()=>{ const u=$('#pcU').value; closeModal(); pushUndo(); const r=addPointCloud(data,f.name,1/UNITS[u].f); afterChange(); zoomExtents(); openPanel('scan'); toast(r.count.toLocaleString('pt-BR')+' pontos importados'+(r.decimated?' (reduzidos)':'')+(r.recentered?' e centralizados na origem':'')); };
  }catch(err){ toast('Não consegui ler esse arquivo: '+(err.message||'formato desconhecido')); } };
$('#skpIn').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(f) openSKPUI(f,'import'); };
$('#daeIn').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(f) importDAEUI(f); };
$('#matIn').onchange=async e=>{ const fs=[...e.target.files]; e.target.value=''; if(fs.length) importMatsUI(fs); };
async function importDAEUI(f){ toast('Importando '+f.name+'…'); pushUndo(); try{ const r=await importDAEFile(f); sel.F.clear(); sel.E.clear(); sel.G=new Set([r.gid]); afterChange(); zoomExtents(); toast(`Importado: ${r.faces} faces, ${r.groups} grupos, ${r.comps} componentes, ${r.mats} materiais`); }catch(err){ console.error(err); undo(); toast('Não consegui importar: '+(err.message||'formato desconhecido')); } }

async function refreshLib(){ libCache=await libAll(); libCache.sort((a,b)=>(a.cat||'').localeCompare(b.cat||'')||a.name.localeCompare(b.name)); if(openPanels.has('mat')) renderLibBox(); }
function renderLibBox(){ const box=$('#libBox'); if(!box) return; if(!libCache){ refreshLib(); return; }

  const cnt=$('#libCount'); if(cnt) cnt.textContent=libCache.length?`· ${libCache.length} materiais`:'';
  if(!libCache.length){ box.innerHTML='<p class="note">Vazia. Os materiais importados com “Importar pasta inteira” ficam guardados aqui para todos os seus projetos neste navegador.</p>'; return; }

  box.innerHTML=`<div class="row" style="margin-bottom:6px"><select class="inp" id="libCatSel" style="flex:1"><option value="">Todas as categorias (${libCache.length})</option>${cats.map(c=>`<option value="${esc(c)}" ${c===libCat?'selected':''}>${esc(c)} (${libCache.filter(m=>(m.cat||'Importados')===c).length})</option>`).join('')}</select><button class="btn sm" id="libDel" title="Remover da biblioteca">Limpar</button></div>
    <div class="swatches">${list.map(m=>`<button class="sw ${M.mats.some(x=>x.id===m.id)&&m.id===curMat?'on':''}" data-lib="${m.id}" title="${esc(m.name)}${m.cat?' — '+esc(m.cat):''}" style="${swatchStyle(m)}"></button>`).join('')}</div>${list.length===400?'<p class="note">Mostrando 400; escolha uma categoria para ver o resto.</p>':''}`;
  $('#libCatSel').onchange=e=>{ libCat=e.target.value; renderLibBox(); };
  $('#libDel').onclick=()=>confirmModal(libCat?'Remover a categoria '+esc(libCat)+'?':'Esvaziar a biblioteca pessoal?','Os materiais já usados nos projetos continuam neles.','Remover',async()=>{ await libClear(libCat||null); libCat=''; await refreshLib(); toast('Biblioteca atualizada'); });
  box.querySelectorAll('[data-lib]').forEach(b=>b.onclick=()=>{ const m=libCache.find(x=>x.id===b.dataset.lib); if(!m) return; if(!M.mats.some(x=>x.id===m.id)){ const c={...m}; M.mats.push(c); } curMat=m.id; afterChange(); if(M.style.mode!=='textured'&&m.img) setStyle('textured'); if(tool.id!=='paint') setTool('paint'); else setHint(tool.hint()); }); }

function importOBJ(txt,name){ const vs=[]; const gid=M.nid++; M.Gr.set(gid,{id:gid,name:(name||'Modelo importado').replace(/\.obj$/i,''),parent:ctx,mx:new M4().toArray(),def:null,tag:null,h:false,lock:false,cls:null,m:null}); const idx=new Map();
  const gv=i=>{ if(idx.has(i)) return idx.get(i); const id=newVert(vs[i],gid); idx.set(i,id); return id; };
  for(const ln of txt.split(/\r?\n/)){ const t=ln.trim().split(/\s+/); if(t[0]==='v') vs.push(new V3(+t[1],-(+t[3]),+t[2])); else if(t[0]==='f'){ const ids=t.slice(1).map(s=>{ let i=parseInt(s); i=i<0?vs.length+i:i-1; return gv(i); }); const u=ids.filter((v,i)=>v!==ids[(i+1)%ids.length]); if(u.length>=3 && newell(u.map(P)).lengthSq()>1e-14) createFaceRaw(u,null,null,gid); } }
  sel.G=new Set([gid]); }
function triangles(){ const out=[]; for(const f of M.F.values()){ if(!entVisible(f)) continue; let Tr; try{ Tr=triangulate(f); }catch(e){ continue; } const m=effMat(f,false); for(const t of Tr.tris) out.push({p:t.map(v=>P(v)),n:Tr.n,m:m?m.id:null}); } return out; }
const yUp=p=>[p.x,p.z,-p.y];
function exportOBJ(){ const tr=triangles(); if(!tr.length){ toast('O modelo está vazio'); return; } let obj='# UNIPERFORMANCE — eixo Y para cima, metros\nmtllib modelo.mtl\n', mtl='# UNIPERFORMANCE\n'; const used=new Set(); let vi=1;
  const byM=new Map(); for(const t of tr){ const k=t.m||'padrao'; if(!byM.has(k)) byM.set(k,[]); byM.get(k).push(t); }
  for(const [k,list] of byM){ obj+=`usemtl ${k}\n`; used.add(k); for(const t of list){ for(const p of t.p) obj+='v '+yUp(p).map(x=>+x.toFixed(6)).join(' ')+'\n'; obj+=`f ${vi} ${vi+1} ${vi+2}\n`; vi+=3; } }
  for(const k of used){ const m=matById(k==='padrao'?null:k); const c=new THREE.Color(m?m.color:DEF_FRONT); c.convertLinearToSRGB(); mtl+=`newmtl ${k}\nKd ${c.r.toFixed(4)} ${c.g.toFixed(4)} ${c.b.toFixed(4)}\nd ${m&&m.op!=null?m.op:1}\n\n`; }
  saveFile('modelo-obj.zip',makeZip([{name:'modelo.obj',data:obj},{name:'modelo.mtl',data:mtl}])); }
function exportSTL(){ const tr=triangles(); if(!tr.length){ toast('O modelo está vazio'); return; } let s='solid uniperformance\n'; for(const t of tr){ s+=`facet normal ${yUp(t.n).map(x=>x.toFixed(6)).join(' ')}\n outer loop\n`; for(const p of t.p) s+='  vertex '+yUp(p).map(x=>x.toFixed(6)).join(' ')+'\n'; s+=' endloop\nendfacet\n'; } s+='endsolid uniperformance\n'; saveFile('modelo-stl.zip',makeZip([{name:'modelo.stl',data:s}])); }
function exportPNG(){ hideMarker(); clearPreview(); renderNow(); canvas.toBlob(b=>{ if(b) saveFile(R.on?'render-uni3d.png':'vista-uni3d.png',b,'image/png'); },'image/png'); }
function exportCSV(){ const rows=[['Nome','Tipo','Classe','Largura (m)','Profundidade (m)','Altura (m)','Área de faces (m²)','Volume (m³)']]; for(const G of M.Gr.values()){ const b=groupBox(G.id), s=b.getSize(new V3()); const area=contentOf(subtree(G.id)).F.reduce((a,f)=>a+faceArea(M.F.get(f)),0); rows.push([groupName(G),G.def?'Componente':'Grupo',G.cls||'',s.x.toFixed(3),s.y.toFixed(3),s.z.toFixed(3),area.toFixed(3),isSolid(G.id)?groupVolume(G.id).toFixed(3):'']); }
  if(rows.length<2){ toast('Não há grupos para relatar'); return; } saveFile('relatorio-uni3d.csv','﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv'); }
function printView(){ hideMarker(); clearPreview(); renderNow(); const url=canvas.toDataURL('image/png'); $('#printArea').innerHTML=`<h1>UNIPERFORMANCE — ${esc(M.info.desc||'Modelo')}</h1><img src="${url}" alt="Vista do modelo">`; setTimeout(()=>{ try{ window.print(); }catch(e){ toast('Imprimir não está disponível aqui; use Exportar imagem'); } },60); }
const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u){ let c=0xFFFFFFFF; for(let i=0;i<u.length;i++) c=CRC[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){ const enc=new TextEncoder(); const parts=[], central=[]; let off=0; const d=new Date(); const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){ const name=enc.encode(f.name), data=typeof f.data==='string'?enc.encode(f.data):f.data, crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,time,true); h.setUint16(12,date,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,time,true); c.setUint16(14,date,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name); off+=30+name.length+data.length; }
  const cdSize=central.reduce((s,a)=>s+a.length,0); const e=new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/zip'}); }

function listLibrary(){ try{ return JSON.parse(localStorage.getItem('uni3d.lib')||'[]'); }catch(e){ return []; } }
function saveToLibrary(){ promptModal('Salvar na biblioteca','Fica guardado neste navegador.',M.info.desc||'Projeto '+new Date().toLocaleDateString('pt-BR'),name=>{ if(!name) return; try{ const lib=listLibrary(); const id='p'+Date.now().toString(36); localStorage.setItem('uni3d.proj.'+id,serialize()); lib.unshift({id,name,t:Date.now()}); localStorage.setItem('uni3d.lib',JSON.stringify(lib)); toast('Salvo na biblioteca'); if(openPanels.has('proj')) fillPanel('proj'); }catch(e){ toast('Sem espaço no navegador. Use Arquivo ▸ Salvar.'); } }); }
function openFromLibrary(id){ try{ const s=localStorage.getItem('uni3d.proj.'+id); if(!s) throw 0; pushUndo(); ctx=0; loadModel(s); buildAxes(); sel.F.clear(); sel.E.clear(); sel.G.clear(); afterChange(); buildSceneTabs(); zoomExtents(); toast('Projeto aberto'); }catch(e){ toast('Não encontrei esse projeto'); } }
function deleteFromLibrary(id){ try{ localStorage.removeItem('uni3d.proj.'+id); localStorage.setItem('uni3d.lib',JSON.stringify(listLibrary().filter(p=>p.id!==id))); }catch(e){} }
async function refreshCloudList(){ const box=$('#cloudList'); if(!box||!DB||!UID) return; try{ const snap=await DB.collection('data/users/'+UID).get(); const items=[]; snap.forEach?snap.forEach(d=>{ const v=d.data(); if(d.id.startsWith('proj_')&&!d.id.includes('_part_')) items.push({id:d.id,...v}); }):(snap.docs||[]).forEach(d=>{ const v=d.data(); if(d.id.startsWith('proj_')&&!d.id.includes('_part_')) items.push({id:d.id,...v}); });
  items.sort((a,b)=>(b.t||0)-(a.t||0)); box.innerHTML=items.length?'<div class="list">'+items.map(p=>`<div class="li"><span class="nm">${esc(p.name)}</span><small>${new Date(p.t).toLocaleDateString('pt-BR')}</small><button class="btn sm" data-co="${p.id}">Abrir</button><button class="x" data-cd="${p.id}">✕</button></div>`).join('')+'</div>':'<p class="note">Nenhum projeto na nuvem ainda.</p>';
  box.querySelectorAll('[data-co]').forEach(b=>b.onclick=()=>openFromCloud(b.dataset.co)); box.querySelectorAll('[data-cd]').forEach(b=>b.onclick=async()=>{ try{ const c=DB.collection('data/users/'+UID); const d=(await c.doc(b.dataset.cd).get()).data(); for(let i=0;i<(d?.parts||0);i++) await c.doc(b.dataset.cd+'_part_'+i).delete(); await c.doc(b.dataset.cd).delete(); refreshCloudList(); }catch(e){ toast('Não foi possível apagar'); } });
  }catch(e){ box.innerHTML='<p class="note">Não foi possível ler a nuvem agora.</p>'; } }
function saveToCloud(){ if(!DB||!UID){ openModal(`<h2>Nuvem UNI</h2><p>A nuvem funciona quando o UNIPERFORMANCE é aberto pelo link publicado no Claude, com sua conta. No arquivo HTML local, use Arquivo ▸ Salvar ou a Biblioteca de projetos.</p><div class="acts"><button class="btn primary" id="mOk">Entendi</button></div>`); $('#mOk').onclick=closeModal; return; }
  promptModal('Salvar na nuvem','O projeto fica na sua conta e abre em qualquer computador.',M.info.desc||'Projeto '+new Date().toLocaleDateString('pt-BR'),async name=>{ if(!name) return; try{ const s=serialize(); const CH=200000; const n=Math.ceil(s.length/CH); const id='proj_'+Date.now().toString(36); const c=DB.collection('data/users/'+UID); for(let i=0;i<n;i++) await c.doc(id+'_part_'+i).set({d:s.slice(i*CH,(i+1)*CH)}); await c.doc(id).set({name,t:Date.now(),parts:n}); toast('Salvo na nuvem'); refreshCloudList(); }catch(e){ toast('Não foi possível salvar na nuvem'); } }); }
async function openFromCloud(id){ try{ const c=DB.collection('data/users/'+UID); const meta=(await c.doc(id).get()).data(); let s=''; for(let i=0;i<meta.parts;i++) s+=(await c.doc(id+'_part_'+i).get()).data().d; pushUndo(); ctx=0; loadModel(s); buildAxes(); sel.F.clear(); sel.E.clear(); sel.G.clear(); afterChange(); buildSceneTabs(); zoomExtents(); toast('Aberto da nuvem: '+meta.name); }catch(e){ toast('Não foi possível abrir da nuvem'); } }
